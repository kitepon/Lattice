name: Windows saved V8 metadata analysis
on:
  push:
    branches: [snowwhite/native-compile-cache-isolation-20261024]
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    runs-on: [self-hosted, factory, windows-native]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Read matching V8 metadata without launching a target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/diagnostics/windows-offline-heap.ps1 -OutputDirectory ./offline-heap-output
      - name: Preserve isolated diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saved-heap-analysis-${{ github.run_id }}
          path: |
            offline-heap-output/*.json
            offline-heap-output/*.txt
          retention-days: 7
