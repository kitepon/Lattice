name: npm公開

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: npmの公開認証対応版を導入
        run: npm install --global npm@11.17.0
      - name: 依存導入
        run: npm ci
      - name: 配布物を構築して製品検査
        run: npm run ci
      - name: 配布物だけを導入してdashboardの読込を確認
        shell: bash
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --loglevel error
          package_file="$RUNNER_TEMP/quolu-lattice-$(node --print 'require("./package.json").version').tgz"
          npm install --prefix "$RUNNER_TEMP/lattice-install" --omit=dev --ignore-scripts "$package_file"
          node "$RUNNER_TEMP/lattice-install/node_modules/@quolu/lattice/bin/lattice-dashboard.mjs" --help
      - name: 既定ブランチの成果をOIDCで公開
        run: npm publish --access public
