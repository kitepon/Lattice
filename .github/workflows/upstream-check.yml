{
  "name": "SEC002 hosted AV metadata build only",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "workflow_head": {
          "description": "Exact reviewed workflow commit SHA",
          "type": "string",
          "required": true
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "sec002-hosted-av-build-only",
    "cancel-in-progress": false
  },
  "jobs": {
    "build-only": {
      "name": "SEC002 compile and inspect only; no generated EXE execution",
      "if": "github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/snowwhite/sec002-hosted-av-build'",
      "runs-on": "windows-2025",
      "timeout-minutes": 20,
      "steps": [
        {
          "name": "exact reviewed workflow and hosted runner entry",
          "shell": "pwsh",
          "env": {
            "EXPECTED_WORKFLOW_HEAD": "${{ inputs.workflow_head }}"
          },
          "run": "$ErrorActionPreference='Stop'\nif($env:EXPECTED_WORKFLOW_HEAD -cnotmatch '^[0-9a-f]{40}$' -or $env:GITHUB_SHA -cne $env:EXPECTED_WORKFLOW_HEAD -or $env:GITHUB_WORKFLOW_SHA -cne $env:EXPECTED_WORKFLOW_HEAD){throw 'workflow_sha_mismatch'}\nif($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64'){throw 'github_hosted_windows_x64_required'}\n'exact workflow guard passed; GitHub-hosted Windows X64 only'"
        },
        {
          "uses": "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09",
          "with": {
            "ref": "a2820b2baf4c6d0c027aca93d01d4e7d4b664211",
            "path": "source",
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "compile link inspect; never run generated executables",
          "shell": "pwsh",
          "env": {
            "EXPECTED_SOURCE_HEAD": "a2820b2baf4c6d0c027aca93d01d4e7d4b664211",
            "EXPECTED_WORKFLOW_HEAD": "${{ inputs.workflow_head }}"
          },
          "run": "& ./source/scripts/diagnostics/sec002-av-build/hosted-build.ps1 -ExpectedSourceHead $env:EXPECTED_SOURCE_HEAD -ExpectedWorkflowHead $env:EXPECTED_WORKFLOW_HEAD -Output \"$env:RUNNER_TEMP/sec002-hosted-av-build-$env:GITHUB_RUN_ID\"\nexit $LASTEXITCODE"
        },
        {
          "name": "source-build records and binaries only; seven days",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "sec002-hosted-av-metadata-build-only",
            "path": "${{ runner.temp }}/sec002-hosted-av-build-${{ github.run_id }}",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
