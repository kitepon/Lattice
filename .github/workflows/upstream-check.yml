{
  "name": "SEC002 pinned Node inheritance and cleanup preparation",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "workflow_head": {
          "description": "Reviewed full caller SHA; separate execution approval required",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "sec002-windows-pinned-products",
    "cancel-in-progress": false
  },
  "jobs": {
    "fixture-only": {
      "if": "github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/snowwhite/sec002-node-fixture'",
      "runs-on": [
        "self-hosted",
        "factory",
        "windows-native"
      ],
      "timeout-minutes": 25,
      "steps": [
        {
          "name": "verify dedicated id13 runtime and acquire only fixed artifact",
          "shell": "pwsh",
          "env": {
            "GH_JOB_TOKEN": "${{ github.token }}",
            "EXPECTED_WORKFLOW_HEAD": "${{ inputs.workflow_head }}"
          },
          "run": "$ErrorActionPreference='Stop'\nSet-StrictMode -Version Latest\nif($env:GITHUB_SHA -cne $env:EXPECTED_WORKFLOW_HEAD -or $env:GITHUB_WORKFLOW_SHA -cne $env:EXPECTED_WORKFLOW_HEAD -or $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:GITHUB_REF -cne 'refs/heads/snowwhite/sec002-node-fixture' -or $env:GITHUB_REPOSITORY -cne 'kitepon/Lattice' -or $env:GITHUB_RUN_ATTEMPT -cne '1'){throw 'workflow_entry'}\nif($env:NODE_OPTIONS -or $env:LATTICE_SENSOR_PARSE_WORKERS -or (Test-Path -LiteralPath 'Env:_NO_DEBUG_HEAP')){throw 'ambient_override'}\n$runtime=node -p 'JSON.stringify({version:process.version,arch:process.arch,platform:process.platform,execPath:process.execPath})'\nif($LASTEXITCODE -ne 0){throw 'runtime_unavailable'}\n$r=$runtime | ConvertFrom-Json\nif($r.version -cne 'v24.20.0' -or $r.arch -cne 'x64' -or $r.platform -cne 'win32'){throw 'runtime_mismatch'}\n$ErrorActionPreference='Stop'\n$identity=[Security.Principal.WindowsIdentity]::GetCurrent()\n$principal=[Security.Principal.WindowsPrincipal]::new($identity)\n$sid=([Security.Principal.NTAccount]::new($env:COMPUTERNAME,'factory-runner')).Translate([Security.Principal.SecurityIdentifier]).Value\nif ($identity.User.Value -ne $sid -or $env:RUNNER_NAME -ne 'factory-windows-fox-u') {throw 'Dedicated identity differs'}\nif (!$env:RUNNER_WORKSPACE.StartsWith('C:\\actions-runner-dotagents-u\\',[StringComparison]::OrdinalIgnoreCase)) {throw 'Dedicated root differs'}\nif ($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {throw 'Runner is administrator'}\n$headers=@{Authorization=\"Bearer $env:GH_JOB_TOKEN\";Accept='application/vnd.github+json'}\n$jobs=Invoke-RestMethod -Headers $headers -Uri \"https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs\"\n$matching=@($jobs.jobs | Where-Object {$_.runner_id -eq 13 -and $_.runner_name -eq 'factory-windows-fox-u' -and $_.status -eq 'in_progress'})\nif ($matching.Count -ne 1) {throw 'Runner id13 assignment unverified'}\n\n\n$root=Join-Path $env:RUNNER_TEMP \"sec002-node-fixture-$env:GITHUB_RUN_ID\"\nif(Test-Path -LiteralPath $root){throw 'fresh_directory_required'}\nNew-Item -ItemType Directory -Path (Join-Path $root 'incoming'),(Join-Path $root 'publish') | Out-Null\nif(![IO.Path]::IsPathFullyQualified($r.execPath) -or [IO.Path]::GetExtension($r.execPath) -ine '.exe'){throw 'node_identity'}\n$nodeHash=(Get-FileHash -LiteralPath $r.execPath -Algorithm SHA256).Hash.ToLowerInvariant()\n@{execPath=$r.execPath;sha256=$nodeHash} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'incoming/runtime-private.json') -Encoding utf8\n$state=[ordered]@{schema='sec002-node-acquisition-v1';targetNodeSha256=$nodeHash;runId=38801258793;artifactId=12004154981;runnerId=13;nonAdministrator=$true;nodeVersion='24.20.0';arch='x64';platform='win32';status='unavailable';archiveVerified=$false}\ntry {\n  $artifact=Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/kitepon/Lattice/actions/artifacts/12004154981' -TimeoutSec 60\n  if($artifact.id -ne 12004154981 -or $artifact.workflow_run.id -ne 38801258793 -or $artifact.name -cne 'sec002-hosted-av-metadata-build-only' -or $artifact.expired -or $artifact.size_in_bytes -ne 526617 -or $artifact.digest -cne 'sha256:f9f73e84517e980a1a7cc436592f857bb765cb3b4344578bcba07875eccff205' -or [DateTimeOffset]::Parse($artifact.expires_at) -le [DateTimeOffset]::UtcNow){throw 'fixed_artifact_unavailable'}\n  $archive=Join-Path $root 'incoming/archive.zip'\n  Invoke-WebRequest -Headers $headers -Uri 'https://api.github.com/repos/kitepon/Lattice/actions/artifacts/12004154981/zip' -OutFile $archive -TimeoutSec 120 | Out-Null\n  if((Get-Item -LiteralPath $archive).Length -ne 526617 -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'f9f73e84517e980a1a7cc436592f857bb765cb3b4344578bcba07875eccff205'){throw 'archive_identity'}\n  $state.status='downloaded_pending_full_validation';$state.archiveVerified=$true\n} catch { $state.status='unavailable' }\n$state | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'publish/acquisition.json') -Encoding utf8\nif(!$state.archiveVerified){throw 'fixed_artifact_unavailable'}\n'runner_id=13 runtime=24.20.0-x64-win32 artifact_id=12004154981 downloaded=true executed=false'\n"
        },
        {
          "uses": "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09",
          "with": {
            "ref": "b4ef4bfed106f96b95203429528d915e531e3d09",
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "three pinned Node cases after paired handoff admission",
          "shell": "pwsh",
          "env": {
            "EXPECTED_WORKFLOW_HEAD": "${{ inputs.workflow_head }}"
          },
          "run": "& ./scripts/diagnostics/sec002-node-fixture/run.ps1 -SourceHead 'b4ef4bfed106f96b95203429528d915e531e3d09' -WorkflowHead $env:EXPECTED_WORKFLOW_HEAD -Root (Join-Path $env:RUNNER_TEMP \"sec002-node-fixture-$env:GITHUB_RUN_ID\")\nexit $LASTEXITCODE"
        },
        {
          "name": "allowlisted observations only",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "sec002-pinned-node-fixture",
            "path": "${{ runner.temp }}/sec002-node-fixture-${{ github.run_id }}/publish",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
